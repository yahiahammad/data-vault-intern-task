
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'data_vault_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'data_vault_dbt'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# AutomateDV has no built-in DuckDB support (see macros/duckdb_dispatch.sql).
# This tells dbt to check our own project first for automate_dv-namespaced
# macros, so our duckdb__ overrides get found before dbt gives up.
dispatch:
  - macro_namespace: automate_dv
    search_order: ['data_vault_dbt', 'automate_dv']

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

models:
  data_vault_dbt:
    # Every layer writes into the lake, not just raw_vault: staging/intermediate
    # are views, but the view *definitions* need to live in the durable DuckLake
    # catalog too, since the in-memory default catalog dies with the session.
    +database: lake
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    raw_vault:
      +materialized: table
      hubs:
        +materialized: incremental
      links:
        +materialized: incremental
      satellites:
        +materialized: incremental

seeds:
  data_vault_dbt:
    +database: lake

tests:
  data_vault_dbt:
    +store_failures: true

