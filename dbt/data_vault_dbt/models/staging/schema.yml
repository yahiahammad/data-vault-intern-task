version: 2

models:
  - name: stg_fbnk_customer
    description: "One row per customer version, parsed from T24's fbnk_customer extract."
    columns:
      - name: customer_id
        description: "Customer business key, split off the recid prefix before the ';'."
        data_tests:
          - not_null
      - name: load_dts
        description: "Batch load timestamp — the DB's clock at insert time, i.e. when this record was actually loaded into the vault."
        data_tests:
          - not_null

  - name: stg_fbnk_account
    description: "One row per account version, parsed from T24's fbnk_account extract."
    columns:
      - name: account_number
        description: "Account business key, taken directly from recid."
        data_tests:
          - not_null
      - name: load_dts
        description: "Batch load timestamp — the DB's clock at insert time, i.e. when this record was actually loaded into the vault."
        data_tests:
          - not_null

  - name: stg_fbnk_stmt_entry
    description: "One row per accounting entry, parsed from T24's fbnk_stmt_entry extract."
    columns:
      - name: stmt_entry_id
        description: "Statement entry business key, taken directly from recid."
        data_tests:
          - not_null
          - unique
      - name: load_dts
        description: "Batch load timestamp — the DB's clock at insert time, i.e. when this record was actually loaded into the vault."
        data_tests:
          - not_null

  - name: stg_seed_account_officer
    description: "Passthrough of the seed_account_officer reference seed, with load_dts/record_source added."
    columns:
      - name: account_officer
        data_tests:
          - not_null

  - name: stg_seed_product_category
    description: "Passthrough of the seed_product_category reference seed, with load_dts/record_source added."
    columns:
      - name: product_category
        data_tests:
          - not_null

  - name: stg_seed_transaction_code
    description: "Passthrough of the seed_transaction_code reference seed, with load_dts/record_source added."
    columns:
      - name: transaction_code
        data_tests:
          - not_null
